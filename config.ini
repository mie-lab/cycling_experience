# ==========================================
#      Project Configuration File
# ==========================================

[paths]
root = # Path to the root directory of the project
video_candidates_path = # Path to the folder containing candidate video files
video_geom_dir = ${paths:root}/input_data/video_traces
context_dir = ${paths:root}/input_data/context_data
# one output folder per workflow
online_survey_output_dir = ${paths:root}/output_data/online_survey
sequence_effects_output_dir = ${paths:root}/output_data/sequence_effects
dynamic_gap_output_dir = ${paths:root}/output_data/dynamic_gap
physiological_data_dir = ${paths:root}/input_data/lab_results/shimmer_recordings
processed_physiological_data_dir = ${paths:root}/input_data/lab_results/shimmer_recordings/processed

[filenames]
# context data
bike_network_file = ${paths:root}/input_data/context_data/bike_network/data/data.gpkg
traffic_volume_file = ${paths:root}/input_data/context_data/traffic_volume/traffic_volume.gpkg
road_network_file = ${paths:root}/input_data/context_data/road_network/data/data.gpkg
side_parking_file = ${paths:root}/input_data/context_data/side_parking/data/data.gpkg
tree_canopy_file = ${paths:root}/input_data/context_data/green_spaces/data/tree_canopy.gpkg
greenery_file = ${paths:root}/input_data/context_data/green_spaces/data/green_spaces.gpkg

# online study data
survey_results_file = ${paths:root}/input_data/online_results/online_survey_results(1-313).xlsx
online_sequence_file = ${paths:root}/input_data/online_results/online_video_sequences.csv

# lab study data
lab_study_results_file = ${paths:root}/input_data/lab_results/study_results(0-59).xlsx
lab_video_sequence_file = ${paths:root}/input_data/lab_results/lab_video_sequence.csv
lab_experiment_setup_file = ${paths:root}/input_data/lab_results/lab_experiment_setup.csv

# related video data
manual_labelling_file = ${paths:root}/input_data/video_data/manual_labels.xlsx
negar_features_file = ${paths:root}/input_data/video_data/env_summary.csv

segmentation_results_file = ${paths:root}/output_data/video_data/segmentation_results.csv
video_info_ground_truth = ${paths:root}/output_data/video_data/video_ground_truth.csv
physiological_results_file = ${paths:root}/output_data/video_data/physiological_results.csv
video_predictions_file = ${paths:root}/output_data/video_data/candidate_predictions.csv

prompt_file = ${paths:root}/input_data/video_data/prompt.txt
video_info_llm_extraction = ${paths:root}/output_data/video_data/video_llm_info.json

[models]
seg_former_model = nvidia/segformer-b2-finetuned-cityscapes-1024-1024
gemini_api_key = ${paths:root}/gemini_api_key.txt

[bikeability]
# inputs for the classic bikeability indices
output_dir = ${paths:sequence_effects_output_dir}/bikeability_indices
video_ground_truth_file = ${filenames:video_info_ground_truth}
video_traces_dir = ${paths:video_geom_dir}
traffic_volume_file = ${filenames:traffic_volume_file}
noise_file = ${filenames:road_network_file}
noise_layer = vas.vas_strassenlaermemissio_event
air_quality_file = ${paths:context_dir}/air_quality/data/ugz.no2_passivsammler_jahreswerte.shp
land_use_file = ${paths:context_dir}/land_use/data/afs.bzo_zone_v.shp
bike_network_file = ${filenames:bike_network_file}
bike_network_layer = taz_mm.tbl_routennetz
recency_weights_file = ${paths:sequence_effects_output_dir}/task3_recency_weights.csv
